version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # A new major of stripe moves to a new Stripe API version (lib/stripe.ts
      # pins apiVersion, and the webhook endpoint has its own): upgrade it on
      # purpose, together with the endpoint, not from a bot PR.
      - dependency-name: stripe
        update-types: ["version-update:semver-major"]
      # The Node.js types follow the Node.js version the app runs on
      # (engines in package.json, Node 22 and 24 on Vercel), not the newest one.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      # eslint-config-next is pinned to the Next.js version: update them together.
      next:
        patterns:
          - next
          - eslint-config-next
      # react and react-dom must always be on the same version.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # The PostCSS plugin compiles with its own tailwindcss: keep both on one version.
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
