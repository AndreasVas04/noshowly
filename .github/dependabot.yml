version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # eslint-config-next is pinned to the Next.js version: update them together.
      next:
        patterns:
          - next
          - eslint-config-next
      # react and react-dom must always be on the same version.
      react:
        patterns:
          - react
          - react-dom
          - "@types/react"
          - "@types/react-dom"
      # The PostCSS plugin compiles with its own tailwindcss: keep both on one version.
      tailwind:
        patterns:
          - tailwindcss
          - "@tailwindcss/*"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns:
          - "*"
